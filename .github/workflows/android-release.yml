name: Android Release (Google Play)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref (tag/branch/SHA) to build. Empty = default branch.
        required: false
        default: ""

defaults:
  run:
    working-directory: app

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📂 Checkout app source (private repo)
        uses: actions/checkout@v4
        with:
          repository: andronasef/memelord-rn
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      # Keep swap enabled so heavy R8/C++/NDK compilation does not trigger OOM/SIGTERM
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🟢 Setup Node (Gradle shells out to node)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔐 Write release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > key.jks

      - name: 📝 Write .signing.env
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD }}" > .signing.env
          echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> .signing.env
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> .signing.env

      - name: 📝 Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > google-services.json

      - name: 🏗️ Expo prebuild (Android)
        run: bunx expo prebuild --platform android --clean

      - name: ⚙️ Configure Gradle Memory for R8
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" > ~/.gradle/gradle.properties
          if [ -f android/gradle.properties ]; then
            if grep -q "org.gradle.jvmargs" android/gradle.properties; then
              sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
            else
              echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
            fi
          fi

      - name: 📦 Build release AAB
        timeout-minutes: 40
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: cd android && ./gradlew bundleRelease

      - name: 🔑 Write Google Play service account key
        run: echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > play-service-account.json

      - name: 🚀 Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: app/play-service-account.json
          packageName: com.increase.mememaker
          releaseFiles: app/android/app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
